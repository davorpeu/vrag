[project]
name = "vrag"
version = "0.1.0"
description = "RAG over versioned documents with Elasticsearch, LangChain, Ollama and Langfuse"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langfuse>=4,<5",
    "elasticsearch>=8.15,<9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "pypdf>=4",
    "python-docx>=1.1",
    "reportlab>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vrag = "vrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# e2e tests need Elasticsearch + Ollama and take minutes: run them with `pytest -m e2e`
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end through the real API, Elasticsearch and the local LLM"]
